name: Update fuel prices

# საწვავის ფასების ავტომატური განახლება priceshub.ge + geogid.ge-დან.
# შედეგი იწერება data/prices.json-ში და commit-დება მხოლოდ ცვლილებისას.

on:
  schedule:
    # ყოველ 3 საათში (UTC). ცხრილი მოგზაურ დროზეა — Actions ზუსტ წუთს ვერ იძლევა.
    - cron: '17 */3 * * *'
  workflow_dispatch:        # ხელით გაშვების ღილაკი Actions-ის ტაბში

# commit-ისთვის საჭირო წვდომა
permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape prices
        run: node scraper/scrape.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/prices.json)" ]; then
            git add data/prices.json
            git commit -m "chore: update fuel prices ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git push
            echo "prices updated"
          else
            echo "no price changes"
          fi
